# XcodeGen fallback: `brew install xcodegen && xcodegen generate`
name: DJRig
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  DJRig:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - DJRig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 2          # iPad only
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DJRig
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Apple Music のライブラリを読み込んで、デッキに曲を送るために使用します。"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
