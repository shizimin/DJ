name: Package & publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build distributable zip
        run: |
          mkdir -p dist/site
          cp index.html README.md dist/site/
          NAME="sixteen-forms-${GITHUB_REF_NAME//\//-}"
          (cd dist/site && zip -r "../${NAME}.zip" .)
          echo "ZIP=dist/${NAME}.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: sixteen-forms
          path: ${{ env.ZIP }}
      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
      - name: Upload Pages content
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  pages:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
