<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sixteen Forms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#101428;--ink:#f5f3ee;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  display:flex;align-items:center;justify-content:center;padding-inline:16px;box-sizing:border-box;
  font-family:"DM Mono",ui-monospace,Menlo,Consolas,monospace;transition:background-color .8s}
canvas{display:block;outline:none;touch-action:none}
canvas:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Sixteen Forms: 全16ステージのシューティングゲーム。Zで開始。"></canvas>
<script>
(() => {
'use strict';
/* =========================================================
   SIXTEEN FORMS — 十六の形
   An abstract vertical shooter in sixteen compositions.
   Single file, no dependencies. Works offline.
   ========================================================= */
const W = 480, H = 640, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let SC = 1;
function resize() {
  const vw = Math.max(200, innerWidth - 32), vh = Math.max(200, innerHeight - 32);
  const s = Math.min(vw / W, vh / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  SC = cv.width / W;
}
addEventListener('resize', resize); resize();

/* ---------- utils ---------- */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rng = mulberry(1);
const R = () => rng(), rr = (a, b) => a + (b - a) * rng(), ri = (a, b) => Math.floor(rr(a, b + 1));
const FR = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI'];
const store = {
  get(k, d) { try { const v = localStorage.getItem('sixteenforms.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sixteenforms.' + k, JSON.stringify(v)); } catch (e) {} }
};
const F_DISP = '"Major Mono Display", "DM Mono", ui-monospace, monospace';
const F_UI = '"DM Mono", ui-monospace, Menlo, Consolas, monospace';

/* ---------- the sixteen forms ---------- */
// pal: [ground, a, b, c, ink]
const STAGES = [
  { n: 'point',     j: '点',   pal: ['#101428','#ffd23f','#ee4266','#3bceac','#f5f3ee'], bg: 'dots',     sides: 3 },
  { n: 'line',      j: '線',   pal: ['#0b1d1a','#e9f59d','#00b4a0','#ff6f59','#eef6ef'], bg: 'lines',    sides: 4 },
  { n: 'plane',     j: '面',   pal: ['#1d1024','#ff9f1c','#2ec4b6','#e71d36','#fdfffc'], bg: 'mondrian', sides: 4 },
  { n: 'circle',    j: '円',   pal: ['#0d1b2a','#f4a259','#5b8e7d','#bc4b51','#f4e285'], bg: 'orbs',     sides: 0 },
  { n: 'grid',      j: '格子', pal: ['#12121c','#7bdff2','#f2b5d4','#b2f7ef','#eff7f6'], bg: 'grid',     sides: 4 },
  { n: 'triangle',  j: '三角', pal: ['#1a0f0a','#f25c54','#f7b267','#f4845f','#fff1e6'], bg: 'tri',      sides: 3 },
  { n: 'rhythm',    j: '律動', pal: ['#0a1a2f','#ff5d8f','#fcd29f','#6dd3ce','#faf3dd'], bg: 'bars',     sides: 5 },
  { n: 'spiral',    j: '螺旋', pal: ['#150a26','#c77dff','#80ffdb','#ffd166','#f8f0ff'], bg: 'rings',    sides: 6 },
  { n: 'mirror',    j: '鏡像', pal: ['#0c1618','#d1ffd7','#5c9ead','#e39774','#f2fff3'], bg: 'waves',    sides: 4 },
  { n: 'tension',   j: '緊張', pal: ['#1e0a0a','#ff3c38','#ffe066','#a3cef1','#fff5f0'], bg: 'lines',    sides: 3 },
  { n: 'void',      j: '虚空', pal: ['#050508','#6c63ff','#ff6584','#3fc1c9','#e8e8f0'], bg: 'dots',     sides: 0 },
  { n: 'prism',     j: '分光', pal: ['#0a0f1f','#ff006e','#3a86ff','#ffbe0b','#f5f5ff'], bg: 'grid',     sides: 6 },
  { n: 'fracture',  j: '断片', pal: ['#161616','#e9c46a','#e76f51','#2a9d8f','#f1faee'], bg: 'mondrian', sides: 5 },
  { n: 'resonance', j: '共鳴', pal: ['#08172b','#00f5d4','#f15bb5','#fee440','#f0fbff'], bg: 'rings',    sides: 8 },
  { n: 'infinity',  j: '無限', pal: ['#0e0b16','#e7dfdd','#7b5cff','#e05cf0','#ffffff'], bg: 'waves',    sides: 7 },
  { n: 'origin',    j: '原点', pal: ['#000000','#ffffff','#ff2e2e','#ffd000','#ffffff'], bg: 'all',      sides: 3 },
];

/* ---------- input ---------- */
const keys = {}; let pressed = {}; const taps = [];
let bombReq = false, pauseReq = false, touchUI = false;
const BLOCK = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyZ','KeyX','KeyC','Enter'];
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true; initAudio();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touch.on = false; if (inGame()) paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && inGame()) paused = true; });
const P_ = c => !!pressed[c];
const touch = { on: false, id: null, sx: 0, sy: 0, px: 0, py: 0, tx: 0, ty: 0, lx: 0, ly: 0 };
function toGame(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
const BOMB_BTN = { x: W - 44, y: H - 50, r: 26 };
cv.addEventListener('pointerdown', e => {
  initAudio(); cv.focus(); e.preventDefault();
  const [x, y] = toGame(e);
  if (e.pointerType !== 'mouse') touchUI = true;
  if (inGame() && !paused) {
    if (touchUI && Math.hypot(x - BOMB_BTN.x, y - BOMB_BTN.y) < BOMB_BTN.r + 10) { bombReq = true; return; }
    if (touchUI && x > W - 64 && y < 64) { pauseReq = true; return; }
    touch.on = true; touch.id = e.pointerId; touch.sx = touch.lx = x; touch.sy = touch.ly = y;
    touch.px = touch.tx = pl.x; touch.py = touch.ty = pl.y;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  taps.push([x, y]);
});
cv.addEventListener('pointermove', e => {
  if (!touch.on || e.pointerId !== touch.id) return;
  const [x, y] = toGame(e); touch.lx = x; touch.ly = y;
  touch.tx = touch.px + (x - touch.sx) * 1.25; touch.ty = touch.py + (y - touch.sy) * 1.25;
});
const endTouch = e => { if (e.pointerId === touch.id) touch.on = false; };
cv.addEventListener('pointerup', endTouch);
cv.addEventListener('pointercancel', endTouch);
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- audio (all synthesized) ---------- */
let AC = null, masterG, sfxG, musG, NB = null;
let muted = store.get('muted', false);
function initAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      masterG = AC.createGain(); masterG.gain.value = muted ? 0 : 0.5; masterG.connect(AC.destination);
      sfxG = AC.createGain(); sfxG.gain.value = 0.55; sfxG.connect(masterG);
      musG = AC.createGain(); musG.gain.value = 0.32; musG.connect(masterG);
      NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      if (inGame()) musicStart(D, !!boss);
    } catch (e) { AC = null; return; }
  }
  if (AC.state === 'suspended') AC.resume();
}
function setMuted(m) { muted = m; store.set('muted', m); if (AC) masterG.gain.value = m ? 0 : 0.5; }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(freq, dur, type, vol, slide, dest, when) {
  if (!AC) return; when = when || AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, when);
  if (slide && slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), when + dur);
  g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(dest || sfxG); o.start(when); o.stop(when + dur + 0.02);
}
function noise(dur, vol, freq, dest, when) {
  if (!AC) return; when = when || AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = NB;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  s.connect(f); f.connect(g); g.connect(dest || sfxG); s.start(when, Math.random()); s.stop(when + dur + 0.05);
}
const sfxLast = {};
const SFX = {
  shot: [6, () => tone(1200, 0.04, 'square', 0.025, 0.5)],
  hit: [4, () => tone(260, 0.03, 'square', 0.03, 0.7)],
  pop: [3, () => { noise(0.15, 0.18, 2400); tone(320, 0.12, 'triangle', 0.12, 0.4); }],
  boom: [8, () => { noise(0.7, 0.4, 900); tone(110, 0.6, 'sine', 0.35, 0.25); }],
  item: [2, () => tone(1560, 0.05, 'sine', 0.05, 1.4)],
  power: [4, () => { tone(660, 0.08, 'triangle', 0.1, 2); }],
  graze: [3, () => tone(2600, 0.02, 'sine', 0.025)],
  die: [0, () => { noise(1.0, 0.45, 700); tone(520, 0.9, 'sawtooth', 0.12, 0.08); }],
  bomb: [0, () => { noise(1.4, 0.5, 400); tone(50, 1.2, 'sine', 0.45, 3); }],
  warn: [20, () => { tone(220, 0.25, 'square', 0.08, 1); tone(233, 0.25, 'square', 0.06, 1); }],
  extend: [0, () => { [0, 4, 7, 12].forEach((n, i) => tone(mtof(72 + n), 0.15, 'triangle', 0.12, 1, sfxG, AC.currentTime + i * 0.07)); }],
  select: [2, () => tone(880, 0.05, 'triangle', 0.08, 1)],
  start: [0, () => { [0, 7, 12].forEach((n, i) => tone(mtof(60 + n), 0.2, 'triangle', 0.12, 1, sfxG, AC.currentTime + i * 0.08)); }],
};
function sfx(n) {
  if (!AC || muted) return;
  const [thr, f] = SFX[n];
  if (frame - (sfxLast[n] ?? -999) < thr) return;
  sfxLast[n] = frame; f();
}
const MUS = { on: false, next: 0, step: 0, bpm: 110, root: 40, prog: [0, 0, 0, 0], bass: [], arp: [], boss: false };
const SCALE = [0, 3, 5, 7, 10];
function musicStart(d, isBoss) {
  if (!AC) return;
  const r = mulberry(900 + d * 13 + (isBoss ? 7 : 0));
  const pick = a => a[Math.floor(r() * a.length)];
  MUS.on = true; MUS.boss = isBoss;
  MUS.bpm = (isBoss ? 136 : 108) + d * 2;
  MUS.root = 36 + ((d * 7) % 12);
  MUS.prog = [0, pick([5, 7, 3, 8]), pick([7, 10, 5, 3]), pick([3, 5, 10, 7])];
  MUS.bass = Array.from({ length: 16 }, (_, i) => i % 4 === 0 || r() < 0.35);
  MUS.arp = Array.from({ length: 8 }, () => Math.floor(r() * 5));
  MUS.step = 0; MUS.next = AC.currentTime + 0.08;
}
function musicStop() { MUS.on = false; }
function playStep(s, t) {
  const bar = (s >> 4) & 3, root = MUS.root + MUS.prog[bar], i = s & 15;
  if (i % 4 === 0 && (MUS.boss || i % 8 === 0)) tone(150, 0.18, 'sine', 0.4, 0.3, musG, t);
  if (i % 8 === 4) noise(0.12, 0.09, 3200, musG, t);
  if (i % 2 === 1) noise(0.025, 0.04, 9000, musG, t);
  if (MUS.bass[i]) tone(mtof(root), 0.16, 'triangle', 0.22, 1, musG, t);
  if (i % 2 === 0) { const k = MUS.arp[i >> 1]; tone(mtof(root + 24 + SCALE[k]), 0.1, 'square', 0.022, 1, musG, t); }
  if (MUS.boss && i % 4 === 2) tone(mtof(root + 12), 0.08, 'sawtooth', 0.03, 1, musG, t);
}
function musicTick() {
  if (!AC || !MUS.on) return;
  const spb = 60 / MUS.bpm / 4;
  if (MUS.next < AC.currentTime - 0.5) MUS.next = AC.currentTime + 0.02;
  while (MUS.next < AC.currentTime + 0.15) { playStep(MUS.step, MUS.next); MUS.next += spb; MUS.step++; }
}

/* ---------- game state ---------- */
let mode = 'title', modeT = 0, paused = false, frame = 0;
let D = 0, S = STAGES[0], PAL = S.pal, SM = 1;
let G = null;
const pl = { x: W / 2, y: H - 80, inv: 0, dead: 0, cd: 0, focus: false };
let enemies = [], eb = [], pb = [], items = [], parts = [], rings = [], pops = [], sched = [], timeline = [];
let stageT = 0, boss = null, bossT = 0, shake = 0, flash = 0, bombT = 0, warnT = 0;
let hi = store.get('hi', 0), unlocked = clamp(store.get('unlocked', 1), 1, 16), cleared = store.get('cleared', false);
let selStage = unlocked - 1;
const EXT = [60000, 150000, 300000, 500000, 800000, 1200000, 1700000, 2300000, 3000000];
const inGame = () => mode === 'intro' || mode === 'play' || mode === 'clear';
const iv = n => Math.max(4, Math.round(n * (1 - D * 0.03)));
const aim = (x, y) => Math.atan2(pl.y - y, pl.x - x);
const later = (dt, f) => sched.push({ t: stageT + dt, f });

function setGround(p) { document.documentElement.style.setProperty('--bg', p[0]); document.documentElement.style.setProperty('--ink', p[4]); }
setGround(STAGES[selStage].pal);

function newGame(start) {
  G = { score: 0, lives: 2, bombs: 3, pw: 1, graze: 0, ext: 0, cont: 0, bonus: 0, start };
  sfx('start');
  beginStage(start);
}
function beginStage(i) {
  D = i; S = STAGES[i]; PAL = S.pal; SM = 1 + D * 0.035;
  rng = mulberry(1000 + i * 7919);
  enemies = []; eb = []; pb = []; items = []; parts = []; rings = []; pops = []; sched = [];
  stageT = 0; boss = null; warnT = 0; bombT = 0; flash = 0; shake = 0;
  pl.x = W / 2; pl.y = H - 80; pl.inv = 120; pl.dead = 0; pl.cd = 0;
  touch.on = false;
  buildTimeline();
  mode = 'intro'; modeT = 0; paused = false;
  setGround(PAL);
  musicStart(D, false);
}
function poolFor(d) {
  const p = ['column', 'swoop', 'rain', 'fan'];
  if (d >= 1) p.push('drift');
  if (d >= 2) p.push('cross');
  if (d >= 3) p.push('turret');
  if (d >= 4) p.push('orbit');
  if (d >= 6) p.push('wall');
  return p;
}
function buildTimeline() {
  timeline = [];
  const pool = poolFor(D);
  let t = 180; const n = 14 + D;
  for (let i = 0; i < n; i++) {
    timeline.push({ t, w: pool[Math.floor(R() * pool.length)] });
    if (D >= 5 && R() < 0.2 + D * 0.02) timeline.push({ t: t + 40, w: pool[Math.floor(R() * pool.length)] });
    t += Math.max(78, 160 - D * 5) + ri(-20, 20);
  }
  timeline.sort((a, b) => a.t - b.t);
  bossT = t + 200;
}

/* ---------- entities ---------- */
function shoot(x, y, a, s, o) {
  if (eb.length > 1100) return;
  o = o || {};
  const sp = s * SM;
  eb.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: o.r || 4, c: o.c || PAL[2], k: o.k || 0,
    av: o.av || 0, avd: o.avd || 1, acc: o.acc || 0, min: o.min ?? 0.2, max: o.max || 9, re: o.re || 0, reS: o.reS || 0, t: 0, gz: false });
}
function ring(x, y, n, s, off, o) { for (let i = 0; i < n; i++) shoot(x, y, off + i * TAU / n, s, o); }
function fan(x, y, n, spread, s, a, o) { for (let i = 0; i < n; i++) shoot(x, y, a + (i - (n - 1) / 2) * spread, s, o); }
function spawn(o) {
  const e = Object.assign({ x: 0, y: -20, vx: 0, vy: 0, r: 12, hp: 3, n: 4, rot: FR() * TAU, spin: 0.03, c: PAL[1],
    sc: 100, drop: 0.25, t: 0, fl: 0, move: null, fire: null, big: false, boss: false, inv: 0, dead: false }, o);
  e.mhp = e.hp; enemies.push(e); return e;
}
const onScreen = e => e.y > 0 && e.y < H - 70 && e.x > 0 && e.x < W;

const WAVES = {
  column() {
    const x = rr(60, W - 60), n = 4 + Math.min(4, D >> 2);
    for (let i = 0; i < n; i++) later(i * 14, () => spawn({ x, y: -16, vy: 2.4, n: 3, r: 11, hp: 2 + (D * 0.4 | 0), c: PAL[1],
      fire: e => { if (e.t === 30 + (i * 7) % 20 && e.y < H * 0.6) fan(e.x, e.y, D > 5 ? 3 : 1, 0.2, 2.6, aim(e.x, e.y)); } }));
  },
  swoop() {
    const dir = R() < 0.5 ? 1 : -1, y0 = rr(40, 160);
    for (let i = 0; i < 6; i++) later(i * 10, () => spawn({ x: dir > 0 ? -20 : W + 20, y: y0, n: 4, r: 10, hp: 2 + (D * 0.4 | 0), c: PAL[2],
      move: e => { e.x += dir * 2.8; e.y = y0 + Math.sin(e.t * 0.045) * 50 + e.t * 0.5; },
      fire: e => { if (e.t % iv(60) === 20) shoot(e.x, e.y, aim(e.x, e.y), 2.4, { c: PAL[1] }); } }));
  },
  drift() {
    const x = rr(100, W - 100);
    spawn({ x, y: -40, vy: 0.8, n: 6, r: 26, hp: 24 + D * 4, big: true, c: PAL[3], sc: 800, drop: 1, spin: 0.01,
      fire: e => { if (e.t % iv(55) === 0) ring(e.x, e.y, 8 + (D >> 1), 1.9, e.t * 0.1, { c: PAL[3], r: 5 }); } });
  },
  rain() {
    const n = 10 + D;
    for (let i = 0; i < n; i++) later(i * 6, () => spawn({ x: rr(20, W - 20), y: -12, vy: rr(3.2, 4.5), n: 4, r: 7, hp: 1, c: PAL[1], sc: 50, drop: 0.08, spin: 0.12,
      fire: D >= 6 ? (e => { if (e.t === 24) shoot(e.x, e.y, aim(e.x, e.y), 2.2, { c: PAL[2], r: 3 }); }) : null }));
  },
  turret() {
    for (const s of [-1, 1]) {
      spawn({ x: W / 2 + s * rr(80, 160), y: -24, n: 5, r: 18, hp: 16 + D * 2, c: PAL[2], sc: 400, drop: 0.8,
        move: e => { if (e.t < 60) e.y += (120 - e.y) * 0.05; else if (e.t > 260) e.y -= 2; },
        fire: e => { if (e.t > 60 && e.t < 260 && e.t % iv(8) === 0) { const arms = 2 + (D >> 2); for (let k = 0; k < arms; k++) shoot(e.x, e.y, e.t * 0.05 * s + k * TAU / arms, 1.8, { c: PAL[2] }); } } });
    }
  },
  fan() {
    for (let i = 0; i < 3; i++) {
      const x = W * (i + 1) / 4;
      later(i * 20, () => spawn({ x, y: -16, n: 0, r: 12, hp: 6 + D, c: PAL[3], sc: 250, drop: 0.5,
        move: e => { if (e.t < 50) e.y += 2.4; else if (e.t > 150) e.y += 2.6; },
        fire: e => { if (e.t === 70 || e.t === 110) fan(e.x, e.y, 3 + (D >> 2) * 2, 0.16, 2.6, aim(e.x, e.y), { c: PAL[3], k: 1 }); } }));
    }
  },
  orbit() {
    const cx = rr(120, W - 120), m = 6;
    for (let i = 0; i < m; i++) spawn({ x: cx, y: -120, n: 0, r: 8, hp: 3 + (D >> 1), c: PAL[1], sc: 150, drop: 0.3,
      move: e => { const a = e.t * 0.04 + i * TAU / m; e.x = cx + Math.cos(a) * 50; e.y = -60 + e.t * 1.1 + Math.sin(a) * 50; },
      fire: e => { if (e.t % iv(90) === 45 + (i * 7) % 30) shoot(e.x, e.y, aim(e.x, e.y), 2.3, { c: PAL[2] }); } });
  },
  cross() {
    for (let i = 0; i < 6; i++) later(i * 12, () => {
      const s = i % 2 ? 1 : -1;
      spawn({ x: s > 0 ? -16 : W + 16, y: rr(0, 80), vx: s * 2.4, vy: 1.8, n: 3, r: 10, hp: 3 + (D >> 1), c: PAL[2], sc: 120,
        fire: e => { if (e.t % iv(40) === 10) shoot(e.x, e.y, Math.PI / 2, 2.8, { c: PAL[1], r: 3 }); } });
    });
  },
  wall() {
    const n = 7;

  },
  mondrian(t, p) {
    const tiles = mondrianTiles(4242 + D), off = (t * 0.7) % 960;
    ctx.lineWidth = 4;
    for (const k of [-960, 0]) for (const b of tiles) {
      const y = b.y + off + k; if (y > H || y + b.h < 0) continue;
      if (b.c) { ctx.globalAlpha = 0.16; ctx.fillStyle = p[b.c]; ctx.fillRect(b.x, y, b.w, b.h); }
      ctx.globalAlpha = 0.09; ctx.strokeStyle = p[4]; ctx.strokeRect(b.x, y, b.w, b.h);
    }
  },
  orbs(t, p) {
    for (let i = 0; i < 8; i++) {
      const r = 50 + (i * 37) % 110, sp = 0.3 + (i % 4) * 0.15;
      const x = (i * 131 + Math.sin(t * 0.004 + i) * 40) % W, y = ((i * 211 + t * sp) % (H + r * 2)) - r;
      ctx.globalAlpha = 0.13; ctx.fillStyle = p[1 + i % 3];

      ctx.globalAlpha = 0.18; ctx.strokeStyle = p[4]; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, TAU); ctx.stroke();
    }
  },
  grid(t, p) {
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(Math.sin(t * 0.002) * 0.35);
    const sp = 40, off = (t * 0.8) % sp; ctx.lineWidth = 1;
    for (let i = -12; i <= 12; i++) {
      ctx.strokeStyle = i % 4 === 0 ? p[1] : p[4]; ctx.globalAlpha = i % 4 === 0 ? 0.28 : 0.08;

  },
  tri(t, p) {

      ctx.globalAlpha = 0.12; ctx.fillStyle = p[1 + i % 3];

    }
  },
  bars(t, p) {
    const n = 12, bw = W / n;
    for (let i = 0; i < n; i++) {
      const h = (Math.sin(t * 0.05 + i * 0.7) * 0.5 + 0.5) * H * 0.45 + 30;
      ctx.globalAlpha = 0.14; ctx.fillStyle = p[1 + i % 3];
      ctx.fillRect(i * bw + 3, H - h, bw - 6, h);
      ctx.globalAlpha = 0.07; ctx.fillRect(i * bw + 3, 0, bw - 6, h * 0.35);

  },
  rings(t, p) {
    ctx.lineWidth = 3;
    for (let i = 0; i < 14; i++) {
      const r = (i * 46 + t * 0.8) % 640;
      ctx.globalAlpha = 0.25 * (1 - r / 640); ctx.strokeStyle = p[1 + i % 3];
      ctx.beginPath(); ctx.arc(W / 2, H * 0.32, r, 0, TAU); ctx.stroke();

  },
  waves(t, p) {
    ctx.lineWidth = 2;
    for (let i = 0; i < 11; i++) {
      const by = i * 62 + ((t * 0.5) % 62) - 31;
      ctx.globalAlpha = 0.18; ctx.strokeStyle = p[1 + i % 3]; ctx.beginPath();
      for (let x = 0; x <= W; x += 12) { const y = by + Math.sin(x * 0.02 + t * 0.03 + i) * 18; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
      ctx.globalAlpha = 0.12; ctx.strokeStyle = p[4]; ctx.beginPath();
      for (let x = 0; x <= W; x += 12) { const y = by + Math.sin(W - x * 0.02 - t * 0.03 + i) * 18 + 8; x ? ctx.lineTo(W - x, y) : ctx.moveTo(W - x, y); }
      ctx.stroke();
    }
  },
};
function drawBG(motif, t, p) {
  ctx.save();
  if (motif === 'all') motif = MOTIFS[Math.floor(t / 480) % MOTIFS.length];
  BG[motif](t, p);
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ---------- render ---------- */
function drawEnemy(e) {
  const fill = e.fl > 0 ? PAL[4] : e.c;
  if (e.boss) return drawBoss(e);
  ctx.fillStyle = fill; shapePath(e.x, e.y, e.r, e.n, e.rot); ctx.fill();
  ctx.strokeStyle = PAL[4]; ctx.globalAlpha = 0.7; ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1;
  if (e.big) {
    ctx.fillStyle = PAL[0]; shapePath(e.x, e.y, e.r * 0.55, e.n, -e.rot * 2); ctx.fill();
    ctx.fillStyle = PAL[2]; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.2, 0, TAU); ctx.fill();
  } else if (e.r > 9) {
    ctx.fillStyle = PAL[0]; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.25, 0, TAU); ctx.fill();
  }
}
function drawBoss(b) {
  const r = b.r, t = b.t, hit = b.fl > 0;
  // Kandinsky lines
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.globalAlpha = 0.55; ctx.strokeStyle = PAL[4]; ctx.lineWidth = 1.5;
  for (let k = 0; k < 3; k++) { const a = t * 0.006 * (k % 2 ? -1 : 1) + k * 1.1; ctx.beginPath(); ctx.moveTo(Math.cos(a) * -r * 2.4, Math.sin(a) * -r * 2.4); ctx.lineTo(Math.cos(a) * r * 2.4, Math.sin(a) * r * 2.4); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.restore();
  // satellites
  const ns = 2 + (D % 4);
  for (let k = 0; k < ns; k++) {
    const a = t * 0.03 + k * TAU / ns, x = b.x + Math.cos(a) * (r + 22), y = b.y + Math.sin(a) * (r + 22) * 0.8;
    ctx.fillStyle = PAL[3]; shapePath(x, y, 7, (k % 2) ? 4 : 0, a); ctx.fill();
  }
  const n = b.n || 0;
  ctx.fillStyle = hit ? PAL[4] : PAL[1]; shapePath(b.x, b.y, r, n, b.rot); ctx.fill();
  ctx.fillStyle = PAL[0]; shapePath(b.x, b.y, r * 0.72, n, -b.rot * 1.5); ctx.fill();
  ctx.fillStyle = hit ? PAL[4] : PAL[2]; shapePath(b.x, b.y, r * 0.5, n === 0 ? 3 : n, b.rot * 2); ctx.fill();
  ctx.fillStyle = PAL[4]; ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.16, 0, TAU); ctx.fill();
  if (b.inv > 0 && (frame >> 2) % 2) { ctx.strokeStyle = PAL[4]; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, r + 8, 0, TAU); ctx.stroke(); }
}
function drawPlayer() {
  if (pl.dead > 0 || !G) return;
  if (pl.inv > 0 && (frame >> 2) % 2) ctx.globalAlpha = 0.35;
  ctx.fillStyle = PAL[4]; shapePath(pl.x, pl.y + 3, 12, 3, 0); ctx.fill();
  ctx.fillStyle = PAL[1]; shapePath(pl.x, pl.y + 5, 5.5, 3, 0); ctx.fill();
  ctx.fillStyle = PAL[2]; ctx.fillRect(pl.x - 13, pl.y + 6, 3, 6); ctx.fillRect(pl.x + 10, pl.y + 6, 3, 6);
  ctx.globalAlpha = 1;
  if (pl.focus) {
    ctx.strokeStyle = PAL[4]; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
    ctx.setLineDash([4, 4]); ctx.lineDashOffset = -frame * 0.4;
    ctx.beginPath(); ctx.arc(pl.x, pl.y, 20, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAL[0]; ctx.beginPath(); ctx.arc(pl.x, pl.y, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = PAL[4]; ctx.beginPath(); ctx.arc(pl.x, pl.y, 2.5, 0, TAU); ctx.fill();
  }
}
function drawBullets() {
  for (const b of eb) {
    if (b.k === 1) {
      const a = Math.atan2(b.vy, b.vx), c = Math.cos(a), s = Math.sin(a), l = b.r * 2.2, w = b.r * 1.1;
      ctx.fillStyle = b.c; ctx.beginPath();
      ctx.moveTo(b.x + c * l, b.y + s * l); ctx.lineTo(b.x - s * w, b.y + c * w); ctx.lineTo(b.x - c * l, b.y - s * l); ctx.lineTo(b.x + s * w, b.y - c * w); ctx.closePath(); ctx.fill();
      ctx.fillStyle = PAL[4]; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 1.5, 0, TAU); ctx.fill();
      ctx.fillStyle = PAL[4]; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.55, 0, TAU); ctx.fill();
    }
  }
}
function drawItems() {
  for (const it of items) {
    if (it.k === 'p') {
      ctx.fillStyle = PAL[2]; shapePath(it.x, it.y, 8, 4, frame * 0.08); ctx.fill();
      ctx.strokeStyle = PAL[4]; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (it.k === 's') {
      ctx.strokeStyle = PAL[4]; ctx.lineWidth = 2; shapePath(it.x, it.y, 6, 4, 0); ctx.stroke();
    } else {
      ctx.fillStyle = PAL[1]; ctx.fillRect(it.x - 2, it.y - 2, 4, 4);
    }
  }
}
function drawFX() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; shapePath(p.x, p.y, p.s, p.n, p.rot); ctx.fill(); }
  for (const r of rings) { ctx.globalAlpha = r.life / r.max; ctx.strokeStyle = r.c; ctx.lineWidth = r.w; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke(); }
  if (bombT > 0) {
    const k = 1 - bombT / 90;
    for (let i = 0; i < 4; i++) { if (k * 700 - i * 40 <= 0) continue; ctx.globalAlpha = (1 - k) * 0.6; ctx.strokeStyle = PAL[1 + i % 3]; ctx.lineWidth = 10 - i * 2; ctx.beginPath(); ctx.arc(pl.x, pl.y, k * 700 - i * 40, 0, TAU); ctx.stroke(); }
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function drawHUD() {
  text(String(G.score).padStart(9, '0'), 14, 24, 16, { c: PAL[4], ls: 1 });
  text('HI ' + String(Math.max(hi, G.score)).padStart(9, '0'), 14, 40, 10, { c: PAL[4], ls: 1 });
  text('FORM ' + ROMAN[D], W - 14, 24, 14, { a: 'right', ls: 2 });
  text(S.n + ' / ' + S.j, W - 14, 40, 10, { a: 'right', ls: 1 });
  // lives & bombs
  ctx.fillStyle = PAL[4];
  for (let i = 0; i < Math.min(G.lives, 8); i++) { shapePath(20 + i * 16, H - 34, 6, 3, 0); ctx.fill(); }
  ctx.fillStyle = PAL[2];
  for (let i = 0; i < G.bombs; i++) { ctx.beginPath(); ctx.arc(20 + i * 16, H - 16, 5, 0, TAU); ctx.fill(); }
  // power
  const px = 150, pw = 90;
  text('PW', px - 4, H - 12, 10, { a: 'right' });
  ctx.globalAlpha = 0.25; ctx.fillStyle = PAL[4]; ctx.fillRect(px, H - 20, pw, 6);
  ctx.globalAlpha = 1; ctx.fillStyle = PAL[1]; ctx.fillRect(px, H - 20, pw * (G.pw - 1) / 3, 6);
  text('GRAZE ' + G.graze, px + pw + 10, H - 13, 10, {});
  // boss bar
  if (boss) {
    const w = W - 28, np = boss.phases.length;
    ctx.globalAlpha = 0.25; ctx.fillStyle = PAL[4]; ctx.fillRect(14, 50, w, 4);
    ctx.globalAlpha = 1; ctx.fillStyle = PAL[2]; ctx.fillRect(14, 50, w * Math.max(0, boss.hp) / boss.mhp, 4);
    ctx.fillStyle = PAL[0]; for (let k = 1; k < np; k++) ctx.fillRect(14 + w * k / np - 1, 49, 2, 6);
  }
  if (touchUI) {
    ctx.globalAlpha = G.bombs > 0 ? 0.55 : 0.2; ctx.strokeStyle = PAL[4]; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(BOMB_BTN.x, BOMB_BTN.y, BOMB_BTN.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1; text('BOMB', BOMB_BTN.x, BOMB_BTN.y + 4, 10, { a: 'center', ls: 1 });
    ctx.globalAlpha = 0.5; ctx.fillStyle = PAL[4]; ctx.fillRect(W - 30, 56, 4, 12); ctx.fillRect(W - 22, 56, 4, 12); ctx.globalAlpha = 1;
  }
  for (const p of pops) { ctx.globalAlpha = Math.min(1, p.t / 20); text(p.s, p.x, p.y, 10, { a: 'center', c: p.c }); }
  ctx.globalAlpha = 1;
}
function veil(a) { ctx.globalAlpha = a; ctx.fillStyle = PAL[0]; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
function drawOverlays() {
  if (mode === 'intro') {
    const a = Math.min(1, modeT / 20, (150 - modeT) / 30);
    ctx.globalAlpha = Math.max(0, a);
    text('FORM', 40, 250, 12, { ls: 6 });
    text(ROMAN[D], 36, 330, 84, { f: F_DISP, w: 400, c: PAL[1] });
    text(S.n, 40, 372, 28, { f: F_DISP, w: 400 });
    text(S.j, 40, 404, 16, { ls: 4, c: PAL[3] });
    ctx.fillStyle = PAL[2]; ctx.fillRect(40, 420, Math.min(1, modeT / 60) * 200, 3);
    ctx.globalAlpha = 1;
  }
  if (warnT > 0) {
    const a = Math.min(1, warnT / 20, (160 - warnT) / 20) * (0.6 + 0.4 * Math.sin(warnT * 0.3));
    ctx.globalAlpha = a * 0.8; ctx.fillStyle = PAL[2];
    for (let i = 0; i < 12; i++) { const x = ((i * 48 + frame * 2) % (W + 48)) - 48; ctx.beginPath(); ctx.moveTo(x, 280); ctx.lineTo(x + 24, 280); ctx.lineTo(x + 36, 300); ctx.lineTo(x + 12, 300); ctx.fill(); }
    ctx.globalAlpha = a; text('core of form ' + ROMAN[D].toLowerCase(), W / 2, 340, 24, { f: F_DISP, w: 400, a: 'center' });
    text('WARNING — 核心接近', W / 2, 364, 11, { a: 'center', ls: 3, c: PAL[1] }); ctx.globalAlpha = 1;
  }
  if (mode === 'clear' && modeT > 40) {
    const a = Math.min(1, (modeT - 40) / 20, (270 - modeT) / 20);
    ctx.globalAlpha = Math.max(0, a);
    text('FORM ' + ROMAN[D], 40, 270, 14, { ls: 6 });
    text('complete', 38, 320, 40, { f: F_DISP, w: 400, c: PAL[1] });
    text('BONUS  ' + G.bonus, 40, 356, 13, { ls: 2 });
    text('GRAZE  ' + G.graze, 40, 376, 13, { ls: 2 });
    ctx.globalAlpha = 1;
  }
  if (paused) {
    veil(0.75);
    text('paused', W / 2, 300, 36, { f: F_DISP, w: 400, a: 'center' });
    text(touchUI ? 'TAP TO RESUME' : 'P / ESC: RESUME    Q: TITLE', W / 2, 336, 11, { a: 'center', ls: 2 });
  }
  if (flash > 0.02) { ctx.globalAlpha = flash * 0.5; ctx.fillStyle = PAL[4]; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
function drawOver() {
  veil(0.8);
  text('game over', 40, 280, 40, { f: F_DISP, w: 400, c: PAL[2] });
  text('FORM ' + ROMAN[D] + ' — ' + S.n.toUpperCase(), 40, 312, 12, { ls: 3 });
  text('SCORE ' + G.score, 40, 340, 12, { ls: 2 });
  if (modeT > 40 && (frame >> 5) % 2 === 0) text(touchUI ? 'TAP: CONTINUE (SCORE RESETS)' : 'Z: CONTINUE (SCORE RESETS)', 40, 392, 12, { ls: 2, c: PAL[1] });
  if (modeT > 40) text(touchUI ? '' : 'X: TITLE', 40, 414, 12, { ls: 2 });
}
function drawEnding() {
  const t = modeT;
  for (let i = 0; i < 16; i++) {
    const p = STAGES[i].pal, a = t * 0.004 + i * TAU / 16, rad = 120 + Math.sin(t * 0.01 + i) * 30;
    ctx.globalAlpha = Math.min(1, t / 60) * 0.85; ctx.fillStyle = p[1];
    shapePath(W / 2 + Math.cos(a) * rad, 250 + Math.sin(a) * rad, 16, STAGES[i].sides, a * 2); ctx.fill();
  }
  ctx.globalAlpha = Math.min(1, t / 90);
  text('sixteen', W / 2, 238, 34, { f: F_DISP, w: 400, a: 'center' });
  text('forms', W / 2, 276, 34, { f: F_DISP, w: 400, a: 'center', c: PAL[2] });
  text('ALL SIXTEEN FORMS COMPLETE', W / 2, 440, 12, { a: 'center', ls: 3 });
  text('全十六形 完成', W / 2, 462, 12, { a: 'center', ls: 4, c: PAL[3] });
  text('SCORE ' + G.score + (G.cont ? '   CONTINUES ' + G.cont : ''), W / 2, 500, 12, { a: 'center', ls: 2 });
  if (t > 120 && (frame >> 5) % 2 === 0) text(touchUI ? 'TAP TO RETURN' : 'PRESS Z', W / 2, 560, 11, { a: 'center', ls: 3, c: PAL[1] });
  ctx.globalAlpha = 1;
}
function drawTitle() {
  const st = STAGES[selStage], p = st.pal, t = frame;
  PAL = p;
  drawBG(st.bg, t, p);
  // hero composition
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = p[1]; ctx.beginPath(); ctx.arc(360, 150 + Math.sin(t * 0.01) * 8, 78, 0, TAU); ctx.fill();
  ctx.fillStyle = p[2]; shapePath(300, 200, 58, 3, Math.sin(t * 0.006) * 0.3); ctx.fill();
  ctx.fillStyle = p[3]; ctx.save(); ctx.translate(380, 230); ctx.rotate(-0.5 + Math.sin(t * 0.008) * 0.05); ctx.fillRect(-90, -5, 180, 10); ctx.restore();
  ctx.strokeStyle = p[4]; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(360, 150 + Math.sin(t * 0.01) * 8, 104, -0.6, 1.9); ctx.stroke();
  ctx.globalAlpha = 1;
  text('sixteen', 30, 128, 50, { f: F_DISP, w: 400, c: p[4] });
  text('forms', 30, 180, 50, { f: F_DISP, w: 400, c: p[4] });
  text('十六の形 · ABSTRACT SHOOTER', 32, 212, 11, { ls: 3, c: p[4] });
  text(muted ? 'SOUND OFF' : 'SOUND ON', W - 16, 30, 10, { a: 'right', ls: 2, c: p[4] });
  // stage select
  ctx.fillStyle = p[0]; ctx.globalAlpha = 0.72; ctx.fillRect(0, 300, W, 150); ctx.globalAlpha = 1;
  text('SELECT FORM   ' + unlocked + ' / 16 OPEN', 32, 330, 10, { ls: 3, c: p[4] });
  const canL = selStage > 0, canR = selStage < unlocked - 1;
  ctx.fillStyle = p[4];
  ctx.globalAlpha = canL ? 1 : 0.2; shapePath(44, 388, 12, 3, -Math.PI / 2); ctx.fill();
  ctx.globalAlpha = canR ? 1 : 0.2; shapePath(W - 44, 388, 12, 3, Math.PI / 2); ctx.fill();
  ctx.globalAlpha = 1;
  text(ROMAN[selStage], 76, 404, 44, { f: F_DISP, w: 400, c: p[1] });
  text(st.n, 200, 386, 22, { f: F_DISP, w: 400, c: p[4] });
  text(st.j, 200, 410, 13, { ls: 4, c: p[3] });
  // 16 tick marks
  for (let i = 0; i < 16; i++) {
    ctx.fillStyle = i === selStage ? p[1] : p[4]; ctx.globalAlpha = i < unlocked ? (i === selStage ? 1 : 0.6) : 0.15;
    ctx.fillRect(32 + i * 26, 432, 18, i === selStage ? 6 : 3);
  }
  ctx.globalAlpha = 1;
  // controls
  const lines = touchUI
    ? ['DRAG      move (auto shot)', 'BOMB      tap the ring, lower right', 'PAUSE     tap ‖, upper right']
    : ['←↑→↓ / WASD   move', 'Z / SPACE     shot (hold)', 'SHIFT / X     focus', 'C             bomb', 'P  pause   M  sound'];
  lines.forEach((l, i) => text(l, 32, 486 + i * 17, 11, { c: p[4], ls: 1 }));
  if ((frame >> 5) % 2 === 0) text(touchUI ? 'TAP TO START' : 'PRESS Z TO START', W - 32, 580, 12, { a: 'right', ls: 3, c: p[1] });
  text('HI ' + String(hi).padStart(9, '0') + (cleared ? '   ★ ALL CLEAR' : ''), 32, 614, 10, { ls: 2, c: p[4] });
}
function render() {
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const p = mode === 'title' ? STAGES[selStage].pal : PAL;
  ctx.fillStyle = p[0]; ctx.fillRect(0, 0, W, H);
  if (mode === 'title') { drawTitle(); return; }
  if (shake > 0.5) ctx.translate((FR() - 0.5) * shake, (FR() - 0.5) * shake);
  drawBG(S.bg, frame, PAL);
  drawItems();
  for (const e of enemies) drawEnemy(e);
  ctx.fillStyle = PAL[4]; ctx.globalAlpha = 0.9;
  for (const b of pb) ctx.fillRect(b.x - 1.5, b.y - 7, 3, 14);
  ctx.globalAlpha = 1;
  drawPlayer();
  drawFX();
  drawBullets();
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  if (mode === 'ending') { drawEnding(); return; }
  drawHUD();
  if (mode === 'over') { drawOver(); return; }
  drawOverlays();
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) {
    update();
    pressed = {}; taps.length = 0; bombReq = false; pauseReq = false;
    acc -= STEP;
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
cv.focus();
})();
